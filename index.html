<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/png/2_2.svg" type="image/x-icon">
  <title>ACT</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <a href="index.html">
      <img src="img/png/1.png" alt="" class="logo">
    </a>
    <nav class="botoes">
      <a href="index.html" id="nav-home"></a>
      <a href="about.html" id="nav-sobre"></a>
      <a href="index.html#contato" id="nav-contato"></a>
      <a href="index.html#resultados" id="nav-depoimentos"></a>
    </nav>
  </header>

  <main>
    <div class="carrossel">
      <div class="slides">
        <div class="slide"><img src="img/Capas/2.png" alt=""></div>
        <div class="slide"><img src="img/Capas/3.png" alt=""></div>
        <div class="slide"><img src="img/Capas/4.png" alt=""></div>
        <div class="slide"><img src="img/Capas/5.png" alt=""></div>
        <div class="slide"><img src="img/Capas/6.png" alt=""></div>
        <div class="slide"><img src="img/Capas/7.png" alt=""></div>
      </div>
      <button class="prev">&laquo;</button>
      <button class="next">&raquo;</button>
    </div>

    <div class="sobrenos">
      <h2 id="sobrenos-titulo"></h2>
      <p id="sobrenos-paragrafo1"></p>
      <p id="sobrenos-paragrafo2"></p>
      <p id="sobrenos-paragrafo3"></p>
      <button onclick="window.location.href='about.html'" class="conhecamais" id="sobrenos-botao"></button>
    </div>

    <div class="abaservicos">
      <h2 id="servicos-titulo"></h2>
      <div class="container">
        <div class="card">
          <details>
            <summary class="slideimg">
              <div class="icon"><img src="/img/servicos/1.png" alt=""></div>
            </summary>
          </details>
          <div class="slidetxt">
            <h3 id="servicos-card1_titulo"></h3>
            <p id="servicos-card1_paragrafo"></p>
            <ul id="servicos-card1_lista"></ul>
            <p id="servicos-card1_paragrafo2"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="resultados" class="resultados">
      <h2 id="resultados-titulo"></h2>
      <div class="carrossel2">
        <div class="slides2">
          <img src="img/Depoimentos/1.png" alt="">
          <img src="img/Depoimentos/2.png" alt="">
          <img src="img/Depoimentos/3.png" alt="">
          <img src="img/Depoimentos/4.png" alt="">
        </div>
        <button class="prev2">&laquo;</button>
        <button class="next2">&raquo;</button>
      </div>
    </div>

    <div id="contato" class="contato-section">
      <h2 id="contato-titulo"></h2>
      <div class="contato-container">
        <div class="contato-item">
          <a href="https://www.facebook.com/ACT.Gestao.Arte.Tude"><img src="/img/png/Facebook.png" alt="Facebook"><span id="contato-facebook"></span></a>
        </div>
        <div class="contato-item">
          <a href=""><img src="/img/png/whatsapp.svg" alt="Telefone"><span id="contato-whatsapp"></span></a>
        </div>
        <div class="contato-item">
          <img src="/img/png/Mail.png" alt="E-mail"><p id="contato-email"></p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span id="footer-texto"></span>
    <img src="/img/png/git.png" alt="">
  </footer>

  <script src="js/content.js"></script>
  <script src="js/text-loader.js"></script>
  <script src="js/carrossel.js" defer></script>
  <script src="js/carrossel2.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
