<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/png/2_2.svg" type="image/x-icon">
    <title>ACT - Consultoria Empresarial</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img id="header-logo" src="" alt="ACT Logo">
            </a>
            <nav>
                <div class="nav-menu" id="nav-menu">
                    <!-- Links injected by JS -->
                </div>
            </nav>
        </div>
    </header>

    <main>
        <!-- Hero Carousel -->
        <section class="hero-carousel" id="hero-carousel">
            <button class="carousel-btn prev-btn" id="hero-prev">&laquo;</button>
            <div class="hero-slides" id="hero-slides">
                <!-- Slides injected by JS or static if preferred, but JS is better for dynamic pathing if needed -->
                <!-- We will hardcode the slide images structure in JS or HTML, but JS gives flexibility -->
            </div>
            <button class="carousel-btn next-btn" id="hero-next">&raquo;</button>
        </section>

        <!-- About Section -->
        <section id="sobrenos" class="section-alt">
            <div class="container">
                <h2 id="about-title"></h2>
                <div class="about-content">
                    <div class="about-text" id="about-text">
                        <!-- Content from JS -->
                    </div>
                    <button class="btn btn-center" id="about-btn" onclick="window.location.href='about.html'"></button>
                </div>
            </div>
        </section>

        <!-- Services Section -->
        <section id="servicos">
            <div class="container">
                <h2 id="services-title"></h2>
                <div class="cards-grid" id="services-grid">
                    <!-- Service cards injected by JS -->
                </div>
            </div>
        </section>

        <!-- Segments Section -->
        <section id="segmentos" class="section-alt">
            <div class="container">
                <!-- Re-using services-title style or similar, but this section didn't have a specific title in old HTML besides being mixed.
                     The data has "segments" with items. Let's render them.
                     The original had separate blocks. We'll render them in a grid. -->
                 <div class="cards-grid" id="segments-grid">
                    <!-- Segment cards injected by JS -->
                 </div>
            </div>
        </section>

        <!-- Expertise Section -->
        <section id="expertises">
            <div class="container">
                <h2 id="expertise-title"></h2>
                <div class="about-text" id="expertise-intro" style="margin-bottom: 2rem;"></div>
                <div class="cards-grid" id="expertise-grid">
                    <!-- Expertise cards injected by JS -->
                </div>
            </div>
        </section>

        <!-- Testimonials Section -->
        <section id="resultados" class="section-alt">
            <div class="container">
                <h2 id="testimonials-title"></h2>
                <div class="testimonials-carousel-container">
                    <button class="testi-btn testi-prev" id="testi-prev">&lt;</button>
                    <div class="testimonials-viewport">
                        <div class="testimonials-track" id="testimonials-track">
                            <!-- 14 Testimonial cards injected by JS -->
                        </div>
                    </div>
                    <button class="testi-btn testi-next" id="testi-next">&gt;</button>
                </div>
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contato">
            <div class="container">
                <h2 id="contact-title"></h2>
                <div class="contact-container" id="contact-container">
                    <!-- Contact items injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <img id="footer-logo" src="" alt="Git Logo" class="footer-logo">
            <p id="footer-text" class="footer-text"></p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
