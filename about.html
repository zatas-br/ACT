    <header>
        <div class="header-container">
            <a href="index.html" class="logo">

            <nav>
                <div class="nav-menu" id="nav-menu">
                    <!-- Links injected by JS -->
                </div>

            </nav>
        </div>
    </header>

    <main>
        <!-- History Section -->
        <section class="section-alt">
            <div class="container">
                <h1 id="history-title" style="text-align: center; margin-bottom: 2rem; color: var(--secondary-color);"></h1>
                <div class="about-content">
                    <div class="about-text" id="history-content">
                        <!-- Content injected by JS -->
                    </div>
                </div>
            </div>
        </section>

                    </div>

        </section>

        <section class="section-alt">
            <div class="container" id="mission-vision-values">
                <!-- Content injected by JS -->
            </div>
        </section>
        
        <div class="espaco" style="height: 50px;"></div>
        
        <!-- Contact Section -->
        <section id="contato">
            <div class="container">
                <h2 id="contact-title"></h2>
                <div class="contact-container" id="contact-container">
                    <!-- Contact items injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <img id="footer-logo" src="" alt="Git Logo" class="footer-logo">
            <p id="footer-text" class="footer-text"></p>
        </div>
    </footer>

    <!-- Global Modal Container -->
    <div id="global-modal-overlay" class="global-modal-overlay">
        <div class="modal-content-wrapper">
            <button id="global-modal-close" class="modal-close-btn">&times;</button>
            <div id="global-modal-body">
                <!-- Content injected by JS -->
            </div>
        </div>

    <script src="js/data.js"></script>
